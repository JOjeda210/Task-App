services:
  db:
    image: postgres:16-alpine
    container_name: taskmanager-db
    env_file:
      - ./backend/.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  backend:
    build: ./backend
    container_name: taskmanager-backend
    env_file:
      - ./backend/.env
    environment:
      - POSTGRES_HOST=db
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: on-failure
    command: sh -c "uv run alembic upgrade head && uv run uvicorn app.main:app --host 0.0.0.0 --port 8000"
  frontend:
    build: ./frontend
    container_name: taskmanager-frontend
    environment:
    #TODO: Ver la forma de no tener que hardcodear la url del backend
      - VITE_API_URL=http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  pgdata: